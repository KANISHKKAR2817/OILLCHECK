version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pillcheck-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-pillcheck-production-grade-secure-signing-key-random-seed-9824}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./pillcheck.db}
      - RATE_LIMIT_PER_MINUTE=120
      - ENGINE_VERSION=2.1.0
    volumes:
      - uploads_data:/app/uploads
      - db_data:/app/db
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pillcheck-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads_data:
  db_data:
